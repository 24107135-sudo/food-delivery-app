name: Assignment 2 Docker ML Monitoring

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compose-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Test web demo
        run: npm ci && npm test && npm run build
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build application images
        run: docker compose build
      - name: Train and register MLflow model
        run: |
          docker compose up -d mlflow
          docker compose --profile train run --rm trainer
      - name: Deploy and smoke-test stack
        run: |
          docker compose up -d app prometheus grafana
          for attempt in $(seq 1 40); do
            if curl --fail http://localhost:8000/health; then break; fi
            sleep 3
          done
          curl --fail http://localhost:8000/health
          curl --fail -X POST http://localhost:8000/predict -H 'Content-Type: application/json' -d '{"order_size":2,"distance_km":3.5}'
          curl --fail http://localhost:8000/metrics | grep food_delivery_predictions_total
          curl --fail http://localhost:9090/-/healthy
          curl --fail http://localhost:3000/api/health
      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes
